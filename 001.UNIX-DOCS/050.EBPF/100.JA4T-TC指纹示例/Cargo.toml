[package]
name = "JA4T_PLUGIN"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ja4t-daemon"
path = "src/main.rs"

[dependencies]
aya = "0.12"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
byteorder = "1"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
cc = "1"
